<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Confirmar presença • Yasmim 15</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="rsvp">

    <div class="monograma">Y</div>

    <h1>Confirme sua presença</h1>

    <p>
      Será uma alegria ter você comigo
      nessa noite tão especial! ✨
    </p>

    <div class="formulario">

      <label for="nome">Digite seu nome</label>

      <input
        type="text"
        id="nome"
        placeholder="Seu nome completo"
        autocomplete="off"
      >

      <button id="buscarBtn">
        Continuar
      </button>

    </div>

    <div id="resultado"></div>

    <a class="voltar" href="index.html">
      ← Voltar para o convite
    </a>

  </main>

  <script src="convidados.js"></script>
  <script src="script.js"></script>

</body>
</html>
